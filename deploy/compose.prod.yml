# Existing stack retained as the trial environment. Keep this project name so
# Docker continues to use the existing yoga-sys_postgres-data volume.
name: yoga-sys

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ./env/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  backend:
    image: yoga-sys-backend:${YOGA_IMAGE_TAG:?set YOGA_IMAGE_TAG to the release image tag}
    restart: unless-stopped
    env_file:
      - ./env/backend.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      internal:
      edge:
        aliases:
          - backend-trial

  frontend:
    image: yoga-sys-frontend:${YOGA_IMAGE_TAG:?set YOGA_IMAGE_TAG to the release image tag}
    restart: unless-stopped
    environment:
      NUXT_BACKEND_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      internal:
      edge:
        aliases:
          - frontend-trial

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal
      - edge

  certbot:
    image: certbot/certbot:${CERTBOT_IMAGE_TAG:-v5.7.0}
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  postgres-data:
  certbot-conf:
  certbot-www:

networks:
  internal:
    driver: bridge
  edge:
    name: yoga-edge
    external: true
