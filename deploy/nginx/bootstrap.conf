limit_req_zone $binary_remote_addr zone=wechat_auth:10m rate=10r/m;

# HTTP-only bootstrap while a certificate for yoga.tuitukj.com is in place.
# During bootstrap the production stack is not started yet, so both API
# paths and the browser host still target the existing trial stack.
server {
    listen 80;
    server_name yoga.tuitukj.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /backend-trial/auth/wechat/ {
        limit_req zone=wechat_auth burst=10 nodelay;
        proxy_pass http://backend-trial:8000/auth/wechat/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /backend-trial/ {
        proxy_pass http://backend-trial:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Preserve the current public API until the production stack is ready.
    location /backend/auth/wechat/ {
        limit_req zone=wechat_auth burst=10 nodelay;
        proxy_pass http://backend-trial:8000/auth/wechat/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /backend/ {
        proxy_pass http://backend-trial:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://backend-trial:8000/healthz;
        access_log off;
    }

    location / {
        proxy_pass http://frontend-trial:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
