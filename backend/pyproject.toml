[project]
name = "yoga-sys-backend"
version = "0.1.0"
description = "Yoga Sys backend service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.16.0",
  "psycopg[binary]>=3.2.0",
  "structlog>=25.0.0",
  "opentelemetry-sdk>=1.36.0",
  "PyJWT>=2.9.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.28.0",
  "schemathesis>=3.39.0",
  "testcontainers[postgres]>=4.9.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
