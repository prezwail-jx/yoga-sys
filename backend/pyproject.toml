[project]
name = "yoga-sys-backend"
version = "0.1.0"
description = "Yoga Sys backend service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.16.0",
  "psycopg[binary]>=3.2.0",
  "structlog>=25.0.0",
  "opentelemetry-sdk>=1.36.0",
  "opentelemetry-exporter-otlp-proto-http>=1.36.0",
  "PyJWT>=2.9.0",
  "passlib[bcrypt]>=1.7.4",
  "psycopg2-binary>=2.9.12",
  "httpx>=0.28.0",
]

[dependency-groups]
dev = [
  "mypy>=1.17.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.12.0",
  "schemathesis>=3.39.0",
  "testcontainers[postgres]>=4.9.0",
  "pyyaml>=6.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
files = [
  "app/api/endpoints/auth.py",
  "app/api/routes/account_bindings.py",
  "app/core/wechat_config.py",
  "app/domain/wechat_identity.py",
  "app/infra/observability.py",
  "app/integrations/wechat.py",
  "app/repositories/wechat_identity.py",
  "app/schemas/wechat_auth.py",
  "app/services/rate_limit.py",
  "app/services/wechat_auth.py",
  "app/services/wechat_binding_recovery.py",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
